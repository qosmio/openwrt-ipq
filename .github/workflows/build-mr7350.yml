name: Build OpenWrt 25.12 NSS MR7350 (Wired HWNAT)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: 1. Tải mã nguồn nhánh 25.12-nss
        uses: actions/checkout@v4
        with:
          ref: 25.12-nss

      - name: 2. Dọn ổ cứng máy chủ để đủ chỗ build
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h

      - name: 3. Cài đặt công cụ biên dịch
        run: |
          sudo apt-get update
          sudo apt-get install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib \
            g++-multilib git gnutls-dev gperf haveged help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev \
            libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5 \
            libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool lld llvm lrzsz mkisofs msmtp \
            nano ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply python3-docutils \
            python3-pyelftools qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo uglifyjs \
            upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd

      - name: 4. Cập nhật danh sách gói (Feeds)
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 5. Nhúng cấu hình an toàn (chỉ Tiếng Việt + thư mục AdGuardHome)
        run: |
          mkdir -p files/etc/uci-defaults files/etc

          cat << 'EOF' > files/etc/uci-defaults/99-mr7350-safe
          #!/bin/sh
          uci set luci.main.lang='vi'
          uci commit luci
          mkdir -p /tmp/adguardhome/work /tmp/adguardhome/log
          chmod 0755 /tmp/adguardhome /tmp/adguardhome/work /tmp/adguardhome/log
          exit 0
          EOF

          cat << 'EOF' > files/etc/rc.local
          #!/bin/sh
          mkdir -p /tmp/adguardhome/work /tmp/adguardhome/log
          chmod 0755 /tmp/adguardhome /tmp/adguardhome/work /tmp/adguardhome/log
          exit 0
          EOF

          chmod +x files/etc/uci-defaults/99-mr7350-safe files/etc/rc.local

      - name: 6. Tạo file .config tối ưu MR7350 (chỉ dây + HWNAT NSS)
        run: |
          cat << 'EOF' > .config
          CONFIG_TARGET_qualcommax=y
          CONFIG_TARGET_qualcommax_ipq60xx=y
          CONFIG_TARGET_qualcommax_ipq60xx_DEVICE_linksys_mr7350=y

          # Giữ HWNAT NSS cho WAN/LAN có dây
          CONFIG_PACKAGE_kmod-qca-nss-drv=y
          CONFIG_PACKAGE_kmod-qca-nss-dp=y
          CONFIG_PACKAGE_kmod-qca-nss-ecm=y
          CONFIG_PACKAGE_kmod-qca-ssdk=y

          # Các gói thêm
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-i18n-base-vi=y
          CONFIG_PACKAGE_ddns-scripts=y
          CONFIG_PACKAGE_ddns-scripts-cloudflare=y
          CONFIG_PACKAGE_luci-app-ddns=y
          CONFIG_PACKAGE_luci-i18n-ddns-vi=y
          CONFIG_PACKAGE_wireguard-tools=y
          CONFIG_PACKAGE_luci-proto-wireguard=y
          CONFIG_PACKAGE_qrencode=y
          CONFIG_PACKAGE_adguardhome=y
          CONFIG_PACKAGE_luci-app-adguardhome=y

          # Bỏ Wi-Fi full
          # CONFIG_PACKAGE_ath11k-firmware-ipq6018 is not set
          # CONFIG_PACKAGE_ipq-wifi-linksys_mr7350 is not set
          # CONFIG_PACKAGE_hostapd-common is not set
          # CONFIG_PACKAGE_iw is not set
          # CONFIG_PACKAGE_kmod-ath is not set
          # CONFIG_PACKAGE_kmod-ath11k is not set
          # CONFIG_PACKAGE_kmod-ath11k-ahb is not set
          # CONFIG_PACKAGE_kmod-cfg80211 is not set
          # CONFIG_PACKAGE_kmod-mac80211 is not set
          # CONFIG_PACKAGE_kmod-nss-wifi-drv is not set
          # CONFIG_PACKAGE_libiwinfo is not set
          # CONFIG_PACKAGE_libiwinfo-data is not set
          # CONFIG_PACKAGE_rpcd-mod-iwinfo is not set
          # CONFIG_PACKAGE_ucode-mod-nl80211 is not set
          # CONFIG_PACKAGE_wifi-scripts is not set
          # CONFIG_PACKAGE_wireless-regdb is not set
          # CONFIG_PACKAGE_wpad-openssl is not set

          # Bỏ IPv6
          # CONFIG_IPV6 is not set
          # CONFIG_PACKAGE_luci-proto-ipv6 is not set
          # CONFIG_PACKAGE_odhcpd-ipv6only is not set
          # CONFIG_PACKAGE_odhcp6c is not set
          # CONFIG_PACKAGE_kmod-nf-reject6 is not set
          # CONFIG_PACKAGE_kmod-udptunnel6 is not set

          # Bỏ SQM / QoS / ZRAM (giữ kmod-sched-core để không lỗi NSS ECM)
          # CONFIG_PACKAGE_luci-app-sqm is not set
          # CONFIG_PACKAGE_sqm-scripts is not set
          # CONFIG_PACKAGE_kmod-ifb is not set
          # CONFIG_PACKAGE_luci-app-qca-ppe-qos is not set
          # CONFIG_PACKAGE_qca-ppe-qos is not set
          # CONFIG_PACKAGE_zram-swap is not set
          # CONFIG_PACKAGE_kmod-zram is not set
          # CONFIG_PACKAGE_kmod-sched-act-pedit is not set
          # CONFIG_PACKAGE_kmod-sched-act-police is not set
          # CONFIG_PACKAGE_kmod-sched-act-vlan is not set
          # CONFIG_PACKAGE_kmod-sched-cake is not set
          # CONFIG_PACKAGE_kmod-sched-ets is not set
          # CONFIG_PACKAGE_kmod-sched-flower is not set
          # CONFIG_PACKAGE_kmod-sched-gred is not set
          # CONFIG_PACKAGE_kmod-sched-mqprio is not set
          # CONFIG_PACKAGE_kmod-sched-mqprio-common is not set
          # CONFIG_PACKAGE_kmod-sched-prio is not set
          # CONFIG_PACKAGE_kmod-sched-red is not set
          EOF
          make defconfig
          grep -E "kmod-qca-nss-ecm|kmod-ath11k|qca-ppe-qos" .config || true

      - name: 7. Tải gói và biên dịch firmware
        run: |
          make download -j$(nproc)
          make -j$(nproc) || make -j1 V=s

      - name: 8. Đóng gói file firmware (.bin) để tải về
        uses: actions/upload-artifact@v4
        with:
          name: MR7350-25.12-NSS-Wired
          path: bin/targets/qualcommax/ipq60xx/*mr7350*.bin
